<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earshot habitat demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="habitat.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body { margin: 0; background: var(--color-paper); color: var(--color-ink); font: 400 var(--text-base)/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
  main { max-width: 88rem; margin: 0 auto; padding: var(--space-6) var(--space-6) var(--space-12); }
  h1 { margin: 0 0 var(--space-2); font: 500 var(--text-2xl)/1.15 var(--font-display); }
  .lede { margin: 0 0 var(--space-6); max-width: 60ch; color: var(--color-muted); }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: var(--space-6); margin-top: var(--space-8); padding-top: var(--space-6); border-top: 1px dashed var(--color-control); font-size: var(--text-sm); }
  fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
  legend { padding: 0; margin-bottom: var(--space-3); font: 500 var(--text-lg)/1.2 var(--font-display); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-2); }
  label { color: var(--color-muted); }
  select, input[type="text"] {
    min-height: 2.25rem; padding: 0 var(--space-2); border: 1px solid var(--color-control); border-radius: var(--radius-sm);
    background: var(--color-paper-2); color: var(--color-ink); font: 400 var(--text-sm)/1 var(--font-body); min-width: 0;
  }
  input[type="text"] { width: 100%; }
  button {
    min-height: 2.25rem; padding: 0 var(--space-4); border: 1px solid var(--color-ink); border-radius: var(--radius-sm);
    background: var(--color-paper); color: var(--color-ink); font: 500 var(--text-sm)/1 var(--font-body); white-space: nowrap; cursor: pointer;
  }
  button:hover { background: var(--color-paper-2); }
  button.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-on-accent); }
  button.primary:hover { background: var(--color-accent-strong); }
  .actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
  output { font-family: var(--font-mono); color: var(--color-ink); }
  :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  @media (max-width: 60rem) { main { padding: var(--space-4) var(--space-4) var(--space-12); } }
</style>
</head>
<body>
<main>
  <h1>The workroom</h1>
  <p class="lede">Sample data: every name, login and number is invented. Set what each agent is doing, fire handoffs, or run the whole line and watch it work. Last event: <output id="last">none</output></p>
  <div id="habitat"></div>

  <div class="controls">
    <fieldset id="states"><legend>What each agent is doing</legend></fieldset>
    <fieldset>
      <legend>Hand work over</legend>
      <div class="row"><label for="from">From</label><select id="from"></select></div>
      <div class="row"><label for="to">To</label><select id="to"></select></div>
      <div class="row"><input type="text" id="text" aria-label="What is handed over" value="19 people score 50 or more"></div>
      <div class="actions"><button type="button" id="fire">Fire handoff</button><button type="button" class="primary" id="run">Run the whole line</button></div>
    </fieldset>
    <fieldset>
      <legend>Trust and the inbox</legend>
      <div class="row"><label for="level">Trust level</label>
        <select id="level"><option>shadow</option><option selected>supervised</option><option>autopilot</option></select></div>
      <div class="row"><span class="muted">Gates passed <output id="gates"></output></span><button type="button" id="pass">Pass one more</button></div>
      <div class="row"><span class="muted">Waiting on you <output id="waiting"></output></span>
        <span class="actions" style="margin: 0"><button type="button" id="add">Add</button><button type="button" id="clear">Clear</button></span></div>
    </fieldset>
  </div>
</main>
<script src="habitat.js"></script>
<script>
var data = {
  agents: [
    { key: "planner", name: "Planner", state: "done", did: "inferred the buyer and five billing pains", count: 5 },
    { key: "scout", name: "Scout", state: "done", did: "read 463 open issues across 41 repositories", count: 463 },
    { key: "qualifier", name: "Qualifier", state: "working", did: "scoring issue 58 of 463 against the five pains", count: 58 },
    { key: "enricher", name: "Enricher", state: "idle", did: "verified email for 19 people", count: 19 },
    { key: "writer", name: "Writer", state: "idle", did: "drafted 14 notes that quote the issue back", count: 14 },
    { key: "reviewer", name: "Reviewer", state: "blocked", did: "second model unavailable, holding 3 drafts", count: 11 },
    { key: "sender", name: "Sender", state: "idle", did: "waiting on the gate", count: 0 }
  ],
  handoffs: [
    { from: "planner", to: "scout", text: "Five pains to listen for, starting with usage-based invoices", ts: "2026-11-24T19:58:12Z" },
    { from: "scout", to: "qualifier", text: "463 issues mention a target pain in the last 30 days", ts: "2026-11-24T20:00:40Z" }
  ],
  trust: { level: "supervised", gates: [
    { label: "Only verified email addresses", passed: true }, { label: "Daily send cap", passed: true },
    { label: "Every draft quotes a real issue", passed: true }, { label: "Reviewer agrees with you", passed: false },
    { label: "Fifty messages reviewed", passed: false }
  ] },
  inbox: [
    { login: "mkowalski", name: "Marta Kowalski", reasons: ["No verified email address"] },
    { login: "dev-ravi", name: "Ravi Menon", reasons: ["Reviewer and Writer disagree"] }
  ]
};
var LINE = [
  ["planner", "scout", "Five pains to listen for: proration, usage invoices, dunning, revenue schedules, contract terms"],
  ["scout", "qualifier", "212 issues describe one of the pains this month"],
  ["qualifier", "enricher", "21 people score 50 or more"],
  ["enricher", "writer", "Verified email for 17 of 21"],
  ["writer", "reviewer", "17 drafts, each quoting its issue"],
  ["reviewer", "inbox", "2 drafts held for you: a claim it could not check"],
  ["reviewer", "sender", "15 drafts passed every claim"]
];
var box = document.getElementById("habitat"), $ = function (id) { return document.getElementById(id); };
var extra = ["jlindqvist", "aoife-b", "tchen", "nsato", "pdiaz"];
var clock = Date.parse("2026-11-24T20:01:00Z");

function agent(k) { return data.agents.find(function (a) { return a.key === k; }); }
function render() {
  EarshotHabitat.render(box, data);
  $("gates").textContent = data.trust.gates.filter(function (g) { return g.passed; }).length + " of " + data.trust.gates.length;
  $("waiting").textContent = data.inbox.length;
  data.agents.forEach(function (a) { $("state-" + a.key).value = a.state; });
}
function handoff(from, to, text) {
  clock += 7000;
  data.handoffs.push({ from: from, to: to, text: text, ts: new Date(clock).toISOString() });
  if (agent(from)) agent(from).state = "done";
  if (agent(to)) { agent(to).state = "working"; agent(to).did = text; agent(to).count = (agent(to).count || 0) + 1; }
  if (to === "inbox") data.inbox.push({ login: extra[data.inbox.length % extra.length], name: "", reasons: [text] });
  render();
}

var states = $("states");
data.agents.forEach(function (a) {
  var row = document.createElement("div"), lab = document.createElement("label"), sel = document.createElement("select");
  row.className = "row"; lab.htmlFor = sel.id = "state-" + a.key; lab.textContent = a.name;
  ["idle", "working", "done", "blocked"].forEach(function (s) { var o = document.createElement("option"); o.textContent = s; sel.append(o); });
  sel.addEventListener("change", function () { a.state = sel.value; render(); });
  row.append(lab, sel); states.append(row);
});
[["from", data.agents.map(function (a) { return a.key; })], ["to", data.agents.map(function (a) { return a.key; }).concat("inbox")]].forEach(function (p) {
  p[1].forEach(function (k) { var o = document.createElement("option"); o.value = k; o.textContent = agent(k) ? agent(k).name : "Needs you"; $(p[0]).append(o); });
});
$("from").value = "qualifier"; $("to").value = "enricher";
$("fire").addEventListener("click", function () { handoff($("from").value, $("to").value, $("text").value || "work"); });
var running = 0;
$("run").addEventListener("click", function () {
  if (running) return;
  data.agents.forEach(function (a) { a.state = "idle"; });
  var i = 0;
  running = setInterval(function () {
    if (i === LINE.length) { clearInterval(running); running = 0; agent("reviewer").state = "done"; agent("sender").state = "done"; render(); return; }
    handoff(LINE[i][0], LINE[i][1], LINE[i][2]); i++;
  }, 2600);
});
$("level").addEventListener("change", function () { data.trust.level = $("level").value; render(); });
$("pass").addEventListener("click", function () { var g = data.trust.gates.find(function (g) { return !g.passed; }); if (g) g.passed = true; render(); });
$("add").addEventListener("click", function () { data.inbox.push({ login: extra[data.inbox.length % extra.length], name: "", reasons: ["Sample"] }); render(); });
$("clear").addEventListener("click", function () { data.inbox = []; render(); });
box.addEventListener("earshot:agent", function (e) { $("last").textContent = "earshot:agent " + e.detail.key; });
render();
</script>
</body>
</html>
