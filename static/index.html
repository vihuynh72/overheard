<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f9f6f0">
<title>Earshot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/ask.css">
</head>
<body class="app">
<header class="bar">
  <a class="brand" href="#home">Earshot</a>
  <nav class="tabs" aria-label="Sections">
    <a href="#home" data-view="home">Customer</a>
    <a href="#leads" data-view="leads">People</a>
    <a href="#activity" data-view="activity">Activity</a>
  </nav>
</header>
<main class="page" id="home" data-page="home">

    <div class="home-top" id="home-top"></div>
    <aside class="ask-slot" id="ask-slot" aria-label="Your decision"></aside>
  </div>
  <p class="home-strip" id="home-strip"></p>
</main>
<main class="page" id="section" data-page="section" hidden>
  <h1 class="section-title" id="panel-title" tabindex="-1"></h1>
  <div id="view"></div>
</main>
<script src="/static/ask.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
