<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earshot map demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="map.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body { margin: 0; background: var(--color-paper); color: var(--color-ink); font: 400 var(--text-base)/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
  main { max-width: 88rem; margin: 0 auto; padding: var(--space-8) var(--space-6) var(--space-12); }
  h1 { margin: 0; font: 500 var(--text-2xl)/1.15 var(--font-display); letter-spacing: -0.015em; }
  .note { margin: var(--space-2) 0 var(--space-6); color: var(--color-muted); font-size: var(--text-sm); }
  .note output { font-family: var(--font-mono); color: var(--color-ink); }
  @media (max-width: 60rem) { main { padding: var(--space-6) var(--space-4) var(--space-12); } }
</style>
</head>
<body>
<main>
  <h1>Who said what</h1>
  <p class="note">Sample data: every name and company here is invented. Last opened: <output id="opened">none</output></p>
  <div id="map"></div>
</main>
<script src="map.js"></script>
<script>
  var pains = [
    { id: "p0", text: "We built our own usage metering on top of Postgres and it falls over every time a customer sends a burst of events. Month-end invoices are wrong and finance finds out before we do." },
    { id: "p1", text: "Credits and prepaid wallets are impossible to model. We hack it with negative line items and pray." },
    { id: "p2", text: "Changing a plan mid-cycle means a spreadsheet, a manual proration and an apology email." },
    { id: "p3", text: "No way to show customers live usage against their limit, so they get surprised by the bill and churn." },
    { id: "p4", text: "Pricing experiments take a sprint each because prices are hardcoded in three services." }
  ];
  // [login, name, score, tier, company or null, stage, [pains], [repos]]
  var rows = [
    ["mtorvik", "Maren Torvik", 88, "A", "Quillstack", "Matched", ["p0"], ["getlago/lago"]],
    ["obadeyi", "Ola Badeyi", 81, "A", "Quillstack", "Drafted", ["p0", "p3"], ["getlago/lago", "openmeterio/openmeter"]],
    ["jrenaud-dev", "Julien Renaud", 74, "B", "Parcelry", "Matched", ["p0"], ["openmeterio/openmeter"]],
    ["ksato", "Kenji Sato", 69, "B", "Tallyforge", "Matched", ["p0"], ["openmeterio/openmeter"]],
    ["ines-q", "Ines Quaresma", 57, "B", null, "Matched", ["p0"], ["getlago/lago"]],
    ["dvolkov", "Dara Volkov", 84, "A", "Brightmeter Labs", "Approved", ["p1"], ["flexprice/flexprice"]],
    ["pmenon", "Priya Menon", 72, "B", "Brightmeter Labs", "Matched", ["p1"], ["getlago/lago"]],
    ["tomasz-k", "Tomasz Kowalewski-Brandt", 61, "B", "Hollowpine", "Matched", ["p1"], ["getlago/lago"]],
    ["aleph-null", "Aleph Nullsworth", 38, "C", null, "Matched", ["p1"], ["flexprice/flexprice"]],
    ["sfairweather", "Sam Fairweather", 77, "A", "Parcelry", "Drafted", ["p2"], ["getlago/lago"]],
    ["lnguyen", "Linh Nguyen", 66, "B", "Corvid Analytics", "Matched", ["p2"], ["getlago/lago", "flexprice/flexprice"]],
    ["rbaptiste", "Rene Baptiste", 49, "C", "Hollowpine", "Matched", ["p2"], ["getlago/lago"]],
    ["hwexler", "Hanna Wexler", 71, "B", "Tallyforge", "Matched", ["p3"], ["openmeterio/openmeter"]],
    ["cadebayo", "Chidi Adebayo", 55, "B", "Corvid Analytics", "Matched", ["p3"], ["openmeterio/openmeter"]],
    ["mlindqvist", "Mia Lindqvist", 42, "C", "Ninebark", "Matched", ["p3"], ["flexprice/flexprice"]],
    ["gferro", "Giulia Ferro", 63, "B", "Ninebark", "Matched", ["p4"], ["flexprice/flexprice"]],
    ["yhalloran", "Yusuf Halloran", 52, "B", "Quillstack", "Matched", ["p4"], ["getlago/lago"]],
    ["bkerrigan", "Bea Kerrigan", 35, "C", "Hollowpine", "Matched", ["p4"], ["openmeterio/openmeter"]]
  ];
  var data = {
    pains: pains,
    people: rows.map(function (r) { return { id: r[0], name: r[1], score: r[2], tier: r[3], company: r[4], stage: r[5] }; }),
    companies: ["Quillstack", "Parcelry", "Tallyforge", "Brightmeter Labs", "Hollowpine", "Corvid Analytics", "Ninebark"].map(function (c) { return { id: c }; }),
    repos: [
      { id: "getlago/lago", kind: "competitor" },
      { id: "openmeterio/openmeter", kind: "competitor" },
      { id: "flexprice/flexprice", kind: "product" }
    ],
    edges: []
  };
  rows.forEach(function (r) {
    r[6].forEach(function (p) { data.edges.push({ from: p, to: r[0] }); });
    if (r[4]) data.edges.push({ from: r[0], to: r[4] });
    r[7].forEach(function (repo) { data.edges.push({ from: r[0], to: repo }); });
  });

  var el = document.getElementById("map");
  EarshotMap.render(el, data);
  el.addEventListener("earshot:open", function (e) { document.getElementById("opened").textContent = e.detail.login; });
</script>
</body>
</html>
