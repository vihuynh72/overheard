<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earshot Ask demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="ask.css">
<style>
  .demo-controls { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-4); }
  .demo-log { margin-top: var(--space-4); font: 400 var(--text-xs)/1.6 var(--font-mono); color: var(--color-muted); max-height: 8rem; overflow-y: auto; }
  .demo-sample { display: inline-block; padding: 0 var(--space-2); border: 1px solid var(--color-gold); border-radius: 2px; font: 500 var(--text-xs)/1.6 var(--font-mono); color: var(--color-gold); text-transform: uppercase; letter-spacing: 0.06em; }
  .demo-lead { margin-top: var(--space-8); max-width: 44rem; }
  .demo-fail[aria-pressed="true"] { border-color: var(--color-danger); color: var(--color-danger); }
</style>
</head>
<body>
<main>
  <div class="view-head">
    <p class="demo-sample">Sample data</p>
    <h1>Ask: one question at a time</h1>
    <p>Every person, repository and message on this page is made up. The buttons feed states to <code>EarshotAsk.update()</code> the way the app does on each poll. Answer with the buttons or with Y, N and L.</p>
    <div class="demo-controls">
      <button type="button" class="btn" data-demo="queue">Queue of three leads</button>
      <button type="button" class="btn quiet" data-demo="trust">Autopilot offer</button>
      <button type="button" class="btn quiet" data-demo="run">Run a search, then finish</button>
      <button type="button" class="btn quiet" data-demo="credits">Credits run low</button>
      <button type="button" class="btn quiet" data-demo="error">Run stops on an error</button>
      <button type="button" class="btn quiet demo-fail" data-demo="fail" aria-pressed="false">Next action fails</button>
      <button type="button" class="btn quiet" data-demo="reset">Start over</button>
    </div>
    <ol class="demo-log" id="log" aria-label="What the stub actions received"></ol>
  </div>

  <article class="demo-lead" id="lead" aria-label="The lead behind the card">
    <p class="muted">No lead open. Load the queue.</p>
  </article>
</main>
<script src="ask.js"></script>
<script>
(() => {
  const DAY = 864e5, ago = d => new Date(Date.now() - d * DAY).toISOString();
  const LEADS = () => [
    {login: "sforgie", name: "Shaun Forgie", company: "Method Maker", score: 91, tier: "A", draft_status: "pending", production: true, newest: ago(12),
      reason: "Runs usage-based billing in production and wrote that their invoices drift from metered usage every month. They maintain the billing service themselves.",
      subject: "The invoice drift you described in #412",
      signals: [{title: "Invoices drift from metered usage at month end", repo: "example-billing/meterd", created: ago(12), match: 0.88},
                {title: "Proration is wrong after plan change", repo: "example-billing/meterd", created: ago(40), match: 0.71}]},
    {login: "dvelasco", name: "Dana Velasco", company: "", score: 74, tier: "B", draft_status: "pending", production: false, newest: ago(260),
      reason: "Asked how to model credits that expire. Personal project, no sign of a team.",
      subject: "Expiring credits, from your question last spring",
      signals: [{title: "How do I model prepaid credits that expire?", repo: "example-oss/lago-like", created: ago(260), match: 0.79}]},
    {login: "pkoh", name: "Priya Koh", company: "@Tidewater Labs", score: 82, tier: "A", draft_status: "pending", production: true, newest: ago(5),
      reason: "Leads platform at a 40-person company and filed three issues about entitlement checks being slow under load.",
      subject: "Entitlement checks under load",
      signals: [{title: "Entitlement check adds 300ms per request", repo: "example-oss/gatekeep", created: ago(5), match: 0.84}]},
    {login: "done1", name: "Already Handled", company: "Old Co", score: 60, tier: "C", draft_status: "approved", reason: "", subject: "", signals: []},
  ];
  const GATES = pass => ["self_check", "agreement", "false_release", "simulation", "regressions"].map(k => ({key: k, label: k, value: "", passed: pass}));
  const fresh = () => ({status: {running: false, error: ""}, leads: [], billing: {credits: 60},
    floor: {trust: {level: "supervised", allowed: true, gates: GATES(false), agreement: {n: 3, agree: 3, rate: 1}}, inbox: []}});
  let state = fresh(), fail = false;

  const $ = id => document.getElementById(id);
  const log = msg => { const li = document.createElement("li"); li.textContent = new Date().toLocaleTimeString() + "  " + msg; $("log").prepend(li); };
  const push = () => EarshotAsk.update(JSON.parse(JSON.stringify(state)), actions);
  const later = (fn, ms = 450) => new Promise((ok, no) => setTimeout(() => { try { ok(fn()); } catch (e) { no(e); } }, ms));
  const maybeFail = () => { if (fail) { fail = false; $("fail").setAttribute("aria-pressed", "false"); throw new Error("Out of credits. Top up credits to continue."); } };

  const actions = {
    decide(login, action, reason) {
      log(`decide("${login}", "${action}", "${reason}")`);
      return later(() => { maybeFail(); state.leads.find(l => l.login === login).draft_status = action === "approve" ? "approved" : "rejected"; push(); return {ok: true}; });
    },
    autonomy(level) {
      log(`autonomy("${level}")`);
      return later(() => { maybeFail(); state.floor.trust.level = level; push(); return {level, allowed: true, note: "Running at autopilot."}; });
    },
    topUp(credits) {
      log(`topUp(${credits})`);
      return later(() => { maybeFail(); state.billing.credits += credits; push(); return {}; });
    },
    open(login) {
      log(`open("${login}")`);
      const l = state.leads.find(x => x.login === login), box = $("lead");
      box.replaceChildren();
      const h = document.createElement("h2"); h.textContent = l.name;
      const f = document.createElement("p"); f.className = "facts"; f.textContent = `${l.company || "No company"} · score ${l.score} · tier ${l.tier}`;
      const r = document.createElement("p"); r.className = "reason"; r.textContent = l.reason;
      const b = document.createElement("div"); b.className = "block";
      const bh = document.createElement("h3"); bh.textContent = "What they wrote"; b.append(bh);
      for (const s of l.signals) {
        const d = document.createElement("div"); d.className = "signal";
        const a = document.createElement("a"); a.href = "#"; a.textContent = s.title;
        const m = document.createElement("p"); m.className = "meta"; m.textContent = `${s.repo} · match ${s.match}`;
        d.append(a, m); b.append(d);
      }
      box.append(h, f, r, b);
    },
  };

  const SCENES = {
    queue() { state.leads = LEADS(); push(); },
    trust() { state.floor.trust.gates = GATES(true); state.floor.trust.agreement = {n: 8, agree: 8, rate: 1}; push(); },
    run() {
      state.status.running = true; push(); log("run started: lead questions wait");
      setTimeout(() => { state.status.running = false; if (!state.leads.length) state.leads = LEADS(); push(); log("run finished"); }, 2500);
    },
    credits() { state.billing.credits = 8; push(); },
    error() { state.status.error = "RuntimeError: GitHub rate limit reached, try again in 12 minutes"; push(); },
    fail(btn) { fail = !fail; btn.setAttribute("aria-pressed", String(fail)); },
    reset() { location.reload(); },
  };
  $("log").previousElementSibling.querySelector("[data-demo=fail]").id = "fail";
  document.addEventListener("click", e => { const b = e.target.closest("[data-demo]"); if (b) SCENES[b.dataset.demo](b); });
  push();
})();
</script>
</body>
</html>
