<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earshot profile demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="profile.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body { margin: 0; background: var(--color-paper); color: var(--color-ink); font: 400 var(--text-base)/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
  main { max-width: 88rem; margin: 0 auto; padding: var(--space-6) var(--space-6) var(--space-12); }
  .sample {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4);
    margin-bottom: var(--space-8); padding: var(--space-3) 0; border-bottom: 1px dashed var(--color-control);
    font-size: var(--text-sm); color: var(--color-muted);
  }
  .sample strong { color: var(--color-ink); font-weight: 600; }
  .sample output { font-family: var(--font-mono); color: var(--color-ink); }
  .sample button {
    min-height: 2.25rem; padding: 0 var(--space-4); border: 1px solid var(--color-ink); border-radius: var(--radius-sm);
    background: var(--color-paper); color: var(--color-ink); font: 500 var(--text-sm)/1 var(--font-body); white-space: nowrap; cursor: pointer;
  }
  .sample button:hover { background: var(--color-paper-2); }
  .sample button[aria-pressed="true"] { background: var(--color-paper-3); }
  :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  @media (max-width: 60rem) { main { padding: var(--space-4) var(--space-4) var(--space-12); } }
</style>
</head>
<body>
<main>
  <p class="sample"><strong>Sample data.</strong> Every name, login and company here is invented.
    <button type="button" id="empty" aria-pressed="false">Show empty state</button>
    <button type="button" id="fit" aria-pressed="false">Show tracker_fit false</button>
    <button type="button" id="again">Re-render</button>
    Last choice: <output id="last">none</output></p>
  <div id="profile"></div>
</main>
<script src="profile.js"></script>
<script>
  var P = [
    "Our homegrown usage metering on Postgres falls over when a customer sends a burst of events and month-end invoices come out wrong",
    "Credits and prepaid wallets are impossible to model, we hack it with negative line items",
    "Changing a plan mid-cycle means a spreadsheet, a manual proration and an apology email",
    "Enterprise contracts with ramp pricing and minimum commits live in a Google Doc nobody can bill from",
    "Failed card payments are not retried and nobody chases overdue invoices until revenue is already lost"
  ];
  function sig(p, repo, title, match, created) { return { pain: P[p], repo: repo, title: title, match: match, created: created }; }
  var leads = [
    { login: "mtorvik", name: "Maren Torvik", score: 91, tier: "A", company: "Quillstack", role: "Head of Platform", production: true, signals: [
      sig(0, "getlago/lago", "Event ingestion drops usage under burst load, invoices undercount", 0.86, "2026-10-02"),
      sig(2, "getlago/lago", "Upgrade mid-period double-charges the base fee", 0.71, "2026-09-11") ] },
    { login: "dkoh", name: "Daniel Koh", score: 87, tier: "A", company: "Relaywise", role: "CTO", production: true, signals: [
      sig(0, "openmeterio/openmeter", "Meter aggregation lags 40 minutes behind, customers see stale usage", 0.79, "2026-10-19") ] },
    { login: "abaptiste", name: "Ana Baptiste", score: 84, tier: "A", company: "Fernhill AI", role: "Founding engineer", production: true, signals: [
      sig(1, "getlago/lago", "How do we model prepaid credits that expire after 12 months?", 0.83, "2026-10-27"),
      sig(0, "getlago/lago", "Duplicate events counted twice after a webhook retry", 0.68, "2026-08-30") ] },
    { login: "rvance", name: "Rhys Vance", score: 80, tier: "B", company: "Tallyroute", role: "Staff engineer", production: true, signals: [
      sig(1, "killbill/killbill", "Wallet balance goes negative when credits and coupons stack", 0.77, "2026-09-03") ] },
    { login: "sokafor", name: "Sade Okafor", score: 78, tier: "B", company: "Brightline Data", role: "VP Engineering", production: true, signals: [
      sig(3, "killbill/killbill", "We need minimum commit plus overage on annual contracts, is that possible?", 0.81, "2026-10-08") ] },
    { login: "lhalvorsen", name: "Lena Halvorsen", score: 75, tier: "B", company: "Northpass", role: "Engineering manager", production: true, signals: [
      sig(2, "getlago/lago", "Proration on downgrade issues a credit note we cannot explain to customers", 0.74, "2026-10-14") ] },
    { login: "jmercer", name: "Jonah Mercer", score: 71, tier: "B", company: "Cobalt Labs", role: "Backend lead", production: false, signals: [
      sig(4, "killbill/killbill", "Dunning retries stopped after the gateway migration and nobody noticed", 0.76, "2026-09-22") ] },
    { login: "pchandra", name: "Priya Chandra", score: 69, tier: "B", company: "Ledgerline", role: "Founder", production: true, signals: [
      sig(3, "openmeterio/openmeter", "Ramp pricing by contract year without a custom plan per customer", 0.72, "2026-10-01"),
      sig(4, "getlago/lago", "Overdue invoices need an automatic reminder sequence", 0.66, "2026-07-18") ] },
    { login: "tbrandt", name: "Tobias Brandt", score: 64, tier: "C", company: null, role: "Indie developer", production: false, signals: [
      sig(1, "getlago/lago", "Top-up credits for an API product, where to start?", 0.62, "2026-10-21") ] },
    { login: "ywu", name: "Yuna Wu", score: 61, tier: "C", company: "Orbitkit", role: "Platform engineer", production: true, signals: [
      sig(0, "openmeterio/openmeter", "Kafka consumer for meters cannot keep up with 50k events per second", 0.7, "2026-10-25") ] }
  ];
  var icp = {
    product: "Flexprice",
    industries: { values: ["B2B SaaS", "AI and API infrastructure", "Developer tools"], confidence: 0.86 },
    company_size: { values: ["20 to 200 employees", "Series A to C"], confidence: 0.62 },
    personas: { values: ["Head of Engineering", "Founding engineer", "Head of Finance"], confidence: 0.81 },
    triggers: { values: ["Launching a usage-based or hybrid plan", "First enterprise deal with a minimum commit", "Homegrown billing breaks at month-end close", "Finance asks for revenue recognition by product line"], confidence: 0.58 },
    pains: P,
    negative_signals: ["Seat-only pricing with no plans to change it", "Fewer than ten paying customers", "Already standardised on Stripe Billing with no complaints", "Consumer subscription apps"],
    expansion: [
      { segment: "Vertical AI agencies", reasoning: "They resell model usage to clients and rebuild metering for every project; three leads above work at agencies." },
      { segment: "Data infrastructure vendors", reasoning: "Charging per query or per gigabyte has the same burst-ingestion problem as API usage." },
      { segment: "Marketplaces with take rates", reasoning: "Revenue share invoicing looks like usage billing, but buyers sit in finance, so public trackers will be thinner." }
    ],
    competitors: [
      { name: "Lago", category: "direct", positioning: "Open-source metering and usage-based billing.", github_repo: "getlago/lago" },
      { name: "OpenMeter", category: "direct", positioning: "Real-time usage metering for AI and API products.", github_repo: "openmeterio/openmeter" },
      { name: "Kill Bill", category: "indirect", positioning: "Long-standing open-source subscription billing platform.", github_repo: "killbill/killbill" },
      { name: "Stripe Billing", category: "indirect", positioning: "Billing built into the payments stack most teams already use.", github_repo: "" },
      { name: "A spreadsheet and a cron job", category: "alternative", positioning: "What most teams run until the first enterprise contract.", github_repo: "" }
    ],
    tracker_fit: true,
    tracker_fit_reason: "Engineers who build billing on open-source tools describe these failures in GitHub issues, so the buyers can be heard directly."
  };
  var declined = Object.assign({}, icp, { tracker_fit: false, tracker_fit_reason: "Its buyers are clinic office managers, who do not write about billing in public issue trackers." });

  var box = document.getElementById("profile");
  var mode = "full";
  function draw() { EarshotProfile.render(box, { icp: mode === "empty" ? null : mode === "declined" ? declined : icp, leads: mode === "full" ? leads : [] }); }
  function toggle(btn, m) {
    btn.addEventListener("click", function () {
      mode = mode === m ? "full" : m;
      document.getElementById("empty").setAttribute("aria-pressed", String(mode === "empty"));
      document.getElementById("fit").setAttribute("aria-pressed", String(mode === "declined"));
      draw();
    });
  }
  toggle(document.getElementById("empty"), "empty");
  toggle(document.getElementById("fit"), "declined");
  document.getElementById("again").addEventListener("click", draw);
  box.addEventListener("earshot:expansion", function (e) { document.getElementById("last").textContent = e.detail.action + " " + e.detail.segment; });
  draw();
</script>
</body>
</html>
