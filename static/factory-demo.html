<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earshot floor demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="factory.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body { margin: 0; background: var(--color-paper); color: var(--color-ink); font: 400 var(--text-base)/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
  main { max-width: 88rem; margin: 0 auto; padding: var(--space-6) var(--space-6) var(--space-12); }
  .sample {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4);
    margin-bottom: var(--space-8); padding: var(--space-3) 0; border-bottom: 1px dashed var(--color-control);
    font-size: var(--text-sm); color: var(--color-muted);
  }
  .sample strong { color: var(--color-ink); font-weight: 600; }
  .sample output { font-family: var(--font-mono); color: var(--color-ink); }
  .sample button {
    min-height: 2.25rem; padding: 0 var(--space-4); border: 1px solid var(--color-ink); border-radius: var(--radius-sm);
    background: var(--color-paper); color: var(--color-ink); font: 500 var(--text-sm)/1 var(--font-body); white-space: nowrap; cursor: pointer;
  }
  .sample button:hover { background: var(--color-paper-2); }
  :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  @media (max-width: 60rem) { main { padding: var(--space-4) var(--space-4) var(--space-12); } }
</style>
</head>
<body>
<main>
  <p class="sample"><strong>Sample data.</strong> Every name, login and number here is invented. <button type="button" id="next">Send the next handoff</button> Last event: <output id="last">none</output></p>
  <div id="floor"></div>
</main>
<script src="factory.js"></script>
<script>
var data = {
  agents: [
    { key: "planner", name: "Planner", state: "done", did: "inferred the profile and five pains", count: 5 },
    { key: "scout", name: "Scout", state: "done", did: "read 463 open issues across 41 repositories", count: 463 },
    { key: "qualifier", name: "Qualifier", state: "working", did: "scoring issue 58 of 463 against the five pains", count: 58 },
    { key: "enricher", name: "Enricher", state: "idle", did: "found company and verified email for 19 people", count: 19 },
    { key: "writer", name: "Writer", state: "idle", did: "drafted 14 notes that quote the issue back", count: 14 },
    { key: "reviewer", name: "Reviewer", state: "idle", did: "passed 11 drafts, held 3 for you", count: 11 },
    { key: "sender", name: "Sender", state: "idle", did: "waiting on your approval for 11 drafts", count: 0 }
  ],
  handoffs: [
    { from: "planner", to: "scout", text: "Five pains to listen for, starting with flaky CI caches", ts: "2026-11-24T19:58:12Z" },
    { from: "scout", to: "qualifier", text: "463 issues mention a target pain in the last 30 days", ts: "2026-11-24T20:00:40Z" },
    { from: "qualifier", to: "enricher", text: "19 people score 50 or more", ts: "2026-11-24T20:00:58Z" },
    { from: "reviewer", to: "inbox", text: "3 drafts held: no verified email", ts: "2026-11-24T20:01:02Z" },
    { from: "scout", to: "qualifier", text: "58 of 463 issues describe a target pain", ts: "2026-11-24T20:01:05Z" }
  ],
  trust: {
    level: "supervised", requested: "autopilot", allowed: false,
    note: "You approve every message before it leaves. Autopilot unlocks when the line has earned it.",
    blocked_by: ["Reviewer agreement is 88%, needs 95%", "Fewer than 50 reviewed messages so far"],
    gates: [
      { key: "email", label: "Only sends to verified email addresses", value: "100%", target: "100%", passed: true, layer: "enforced" },
      { key: "cap", label: "Daily send cap", value: "11", target: "≤ 25", passed: true, layer: "enforced" },
      { key: "evidence", label: "Every draft quotes a real issue", value: "14 of 14", target: "all", passed: true, layer: "checked" },
      { key: "agree", label: "Reviewer agrees with you", value: "88%", target: "95%", passed: false, layer: "checked" },
      { key: "volume", label: "Messages you have reviewed", value: "34", target: "50", passed: false, layer: "checked" },
      { key: "tone", label: "No pitch in the first sentence", value: "13 of 14", target: "most", passed: true, layer: "advised" }
    ],
    agreement: { n: 34, agree: 30, rate: 0.88, false_release: 1, false_hold: 3 }
  },
  inbox: [
    { login: "mkowalski", name: "Marta Kowalski", reasons: ["No verified email address", "Issue is 29 days old"] },
    { login: "dev-ravi", name: "Ravi Menon", reasons: ["Reviewer and Writer disagree on the pain"] },
    { login: "jlindqvist", name: "Johan Lindqvist", reasons: ["Works at a company already in your pipeline", "No verified email address"] }
  ],
  lessons: [
    { id: 1, kind: "Writer", pattern: "Opened with the product name instead of their issue", fix: "First sentence must reference the issue title", status: "fixed", seen: 6, regressed: false },
    { id: 2, kind: "Qualifier", pattern: "Scored bot accounts as people", fix: "Skip logins ending in [bot] and accounts with no human activity", status: "fixed", seen: 4, regressed: false },
    { id: 3, kind: "Writer", pattern: "Promised a free trial the policy never allowed", fix: "Offers come only from the policy text", status: "fixed", seen: 2, regressed: true },
    { id: 4, kind: "Enricher", pattern: "Took a company from an old profile bio", fix: "Prefer the org on their most recent commits", status: "open", seen: 3, regressed: false }
  ],
  simulation: {
    ran_at: "2026-11-24T18:30:00Z", cases: 60,
    by_kind: [
      { kind: "Developer tool", cases: 14, works: 11, thin: 2, fails: 1, avg_leads: 17.4, relevant_pct: 0.82, interested_pct: 0.31, annoyed_pct: 0.04 },
      { kind: "Infrastructure", cases: 12, works: 8, thin: 3, fails: 1, avg_leads: 12.1, relevant_pct: 0.74, interested_pct: 0.26, annoyed_pct: 0.06 },
      { kind: "Security", cases: 12, works: 6, thin: 4, fails: 2, avg_leads: 8.6, relevant_pct: 0.66, interested_pct: 0.18, annoyed_pct: 0.09 },
      { kind: "Data platform", cases: 12, works: 5, thin: 4, fails: 3, avg_leads: 6.2, relevant_pct: 0.58, interested_pct: 0.15, annoyed_pct: 0.11 },
      { kind: "Consumer app", cases: 10, works: 1, thin: 3, fails: 6, avg_leads: 1.8, relevant_pct: 0.21, interested_pct: 0.05, annoyed_pct: 0.24 }
    ],
    fit: [
      "Developer tools fit best: their buyers describe the pain in public issues, in their own words.",
      "Infrastructure works when the pain names a specific system, such as caching or queues.",
      "Security finds fewer people, because the sharpest pains are reported privately.",
      "Data platforms are thin: most issues are about one vendor's bugs, not a general pain.",
      "Consumer apps do not fit. Their users rarely file GitHub issues, and outreach annoys them."
    ]
  }
};

var floor = document.getElementById("floor");
var last = document.getElementById("last");
var hops = [["qualifier", "enricher", "21 people score 50 or more"], ["enricher", "writer", "Verified email for 17 of 21"], ["writer", "reviewer", "17 drafts, each quoting its issue"], ["reviewer", "inbox", "2 drafts held for you"], ["reviewer", "sender", "15 drafts ready for your approval"], ["planner", "scout", "Added a sixth pain from what you edited"]];
var step = 0;
EarshotFactory.render(floor, data);
document.getElementById("next").addEventListener("click", function () {
  var h = hops[step++ % hops.length];
  var prev = new Date(data.handoffs[data.handoffs.length - 1].ts).getTime();
  data.handoffs.push({ from: h[0], to: h[1], text: h[2], ts: new Date(prev + 7000).toISOString() });
  EarshotFactory.render(floor, data);
});
floor.addEventListener("earshot:open", function (e) { last.textContent = "open " + e.detail.login; });
floor.addEventListener("earshot:autonomy", function (e) { last.textContent = "request " + e.detail.level; });
</script>
</body>
</html>
